<h1>Sign Up</h1>
<p>Welcome to BeBrave! Please choose how you would like to sign up:</p>
<form method="post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Enter a username (optional)" value="{{ request.POST.username }}">
    <input type="password" name="password" placeholder="Enter a password" required>
    <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded">
        Quick Sign-Up (No Email Required)
    </button>
</form>
